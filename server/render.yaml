services:
  - type: web
    name: nexlab-api
    runtime: node
    repo: https://github.com/anurag2417/nexlab
    plan: free
    region: oregon
    buildCommand: cd server && npm install && npm install --save-dev @types/node @types/express @types/cors @types/morgan @types/compression @types/jsonwebtoken @types/bcrypt @types/multer @types/uuid && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 30d
      - key: BCRYPT_ROUNDS
        value: 10
      - key: CORS_ORIGIN
        value: https://nexlab.vercel.app
      - key: PYTHON_PATH
        value: python3
      - key: EXECUTION_TIMEOUT
        value: 10000
      - key: MAX_CODE_SIZE
        value: 100000
      - key: MAX_FILE_SIZE
        value: 5242880